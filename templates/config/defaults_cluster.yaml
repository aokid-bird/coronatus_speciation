        bwa_index:
            mem_mb: "64G"
            runtime: 480
        bwa_mem2_index:
            mem_mb: "64G"
            runtime: 480
    qc:
        ingroup_trimmomatic:
            mem_mb: "200G"
            runtime: 1440
        outgroup_trimmomatic:
            mem_mb: "200G"
            runtime: 1440
    mapping:
        ingroup_paired:
            mem_mb: "64G"
            runtime: 1440
        ingroup_unpaired:
            mem_mb: "64G"
            runtime: 1440
        ingroup_merge:
            mem_mb: "200G"
            runtime: 1440
        outgroup_paired:
            mem_mb: "64G"
            runtime: 1440
        outgroup_unpaired:
            mem_mb: "64G"
            runtime: 1440
        outgroup_merge:
            mem_mb: "200G"
            runtime: 1440
        outgroup_longread:
            mem_mb: "200G"
            runtime: 1440
        slice_outgroups:
            mem_mb: "200G"
            runtime: 1440
    analyses:
        angsd_intersect:
            mem_mb: "16G"
            runtime: 1440
        angsd_global:
            mem_mb: "16G"
            runtime: 1440
        angsd_global_unrelated_unlinked:
            mem_mb: "16G"
            runtime: 1440
        angsd_raxml:
            mem_mb: "16G"
            runtime: 1440
        angsd_sfs:
            mem_mb: "16G"
            runtime: 1440
        sfs_realsfs:
            mem_mb: "16G"
            runtime: 480
        ngsdist:
            mem_mb: "16G"
            runtime: 1440
        raxml_catg:
            mem_mb: "200G"
            runtime: 2880
        raxml_run:
            mem_mb: "200G"
            runtime: 4320
        treemix:
            mem_mb: "16G"
            runtime: 1440
        abbababa2:
            mem_mb: "16G"
            runtime: 1440
        snapp:
            mem_mb: "16G"
            runtime: 1440

threads:
    reference:
        index: 2
    qc:
        ingroup_fastqc: 4
        ingroup_trimmomatic: 8
        outgroup_fastqc: 4
        outgroup_trimmomatic: 30
    mapping:
        ingroup: 30
        outgroup: 30
        longread_filter: 4
        slice_outgroups: 30
    analyses:
        angsd_intersect: 8
        angsd_global: 8
        angsd_global_unrelated_unlinked: 8
        angsd_raxml: 8
        angsd_sfs: 8
        sfs_realsfs: 10
        ngsrelate: 4
        ngsld: 8
        pcangsd: 8
        ngsadmix: 18
        ngsdist: 8
        treemix: 8
        treemix_run: 1
        raxml_catg: 60
        raxml_run: 70
        abbababa2: 12
        snapp: 8

slurm:
    partition: "default"
    account: null
    qos: null
    reservation: null
    mail_type: null
    mail_user: null
    default_resources:
        mem_mb: 20000
        runtime: 420
        nodes: 1

paths:
    bam_dir: "results/bwa"
    singularity_dir: "${HOME}/envs/singularity"
    transfer:
        cluster_storage_root: "/lfs/aokid"

inputs:
    samples_tsv: "data/samples.tsv"
    outgroups_tsv: "data/outgroup.tsv"
    references_tsv: "data/references.tsv"

metadata:
    outgroups_seq_column: "sequencer"
    longread_keywords: ["PacBio", "ONT", "Nanopore"]

storage:
    # Resolution order:
    # 1. explicit storage.* / reads.ingroup_dir values below
    # 2. storage.roots.<environment> + storage.shared.* relative subdirectories
    # 3. built-in workflow defaults inside the repository
    # Optional environment-specific roots for reusable data outside the repo.
    # When set, the relative paths under storage.shared are resolved beneath
    # storage.roots.local for local runs and storage.roots.cluster for cluster runs.
    roots:
        local: null   # e.g. "/Volumes/WGS/project_a"
        cluster: null # e.g. "/lfs/aokid/project_a"
    # Shared relative directory layout under the environment-specific roots above.
    # These are treated as relative subdirectory structures, not absolute paths.
    # If storage.roots is null, these shared entries are ignored.
    # Explicit per-directory paths below still take precedence when set.
    shared:
        reference:
            dir: "reference"
        reads:
            ingroup_dir: "reads/ingroup"
        outgroup:
            raw_dir: "outgroup/raw"
            merged_dir: "outgroup/merged"
        derived:
            ingroup:
                trim_dir: "derived/ingroup/trim"
                qc_dir: "derived/ingroup/qc"
                mapping_tmp_dir: "derived/ingroup/mapping_tmp"
            outgroup:
                trim_dir: "derived/outgroup/trim"
                qc_dir: "derived/outgroup/qc"
                mapping_tmp_dir: "derived/outgroup/mapping_tmp"
                longread_filter_dir: "derived/outgroup/longread_filter"
        bam:
            ingroup_dir: "bam/ingroup"
            outgroup_dir: "bam/outgroup"
    reference:
        dir: null
    outgroup:
        raw_dir: null
        merged_dir: null
    derived:
        ingroup:
            trim_dir: null
            qc_dir: null
            mapping_tmp_dir: null
        outgroup:
            trim_dir: null
            qc_dir: null
            mapping_tmp_dir: null
            longread_filter_dir: null
    bam:
        ingroup_dir: null
        outgroup_dir: null

reference:
    fasta: null
    fai: null
    storage_dir: "data/reference"
    download_method: "datasets"

reads:
    # Explicit override for ingroup FASTQ location. If null and storage.roots is set,
    # the workflow uses storage.shared.reads.ingroup_dir under the active root.
    # If both are null, the workflow falls back to its in-repo default.
    ingroup_dir: null
    ingroup_metadata:
        dir_col: "fastq_dir"
        prefix_col: "fastq_prefix"
        r1_suffix_col: "fastq_r1_suffix"
        r2_suffix_col: "fastq_r2_suffix"
        extension_col: "fastq_extension"
        default_prefix: ""
        default_r1_suffix: "_1"
        default_r2_suffix: "_2"
        default_extension: ".fastq.gz"

mapping:
    ingroup:
        mapper: bwa-mem2
        map_unpaired: true
        extra: ""
    outgroup:
        mapper: bwa-mem2
        map_unpaired: true
        extra: ""

longread:
    filter:
        enabled: true
        min_length: 1000
        keep_percent: 90
        extra: ""
    mapping:
        extra: ""

qc:
    ingroup:
        fastqc:
            contaminants: null
        trimmomatic:
            adapters_fa: null
            clip: "2:30:7"
            slidingwindow: "4:15"
            leading: 30
            trailing: 30
            minlen: 36
            extra: ""
    outgroup:
        fastqc:
            contaminants: null
        trimmomatic:
            adapters_fa: null
            clip: "2:30:7"
            slidingwindow: "4:15"
            leading: 30
            trailing: 30
            minlen: 36
            extra: ""

angsd:
    common_args: >
        -GL 1
        -doMaf 1
        -domajorminor 1
        -doBcf 1
        -doPost 1
        -doCounts 1
        -uniqueOnly 1
        -minMapQ 30
        -minQ 20
        -setmindepthind 2
        -skipTriallelic 1
        -baq 2
    args:
        intersect: >
            -doGLF 4
            -doGeno 4
        global: >
            -doGeno 4
            -doGLF 2
            -minMaf 0.15
            -SNP_pval 1e-6
        global_unrelated_unlinked: >
            -doGeno 4
            -doGLF 2
            -minMaf 0.15
            -SNP_pval 1e-06
        raxml: >
            -doGeno 4
            -doGLF 4
        treemix: >
            -doGeno 4
            -doGLF 4
        snapp: >
            -doGeno 4
            -doGLF 2
            -minMaf 0.2
            -SNP_pval 1e-6
            -postCutoff 0.9
        sfs: >
            -doGLF 4
            -doGeno 4
            -dosaf 1
    min_ind_ratio:
        intersect: 0.5
        sfs: 0.5
        global: 0.5
        raxml: 0.5
        treemix: 0.5
        snapp: 1.0

analyses:
    angsd_intersect:
        enabled: true
    angsd_global:
        enabled: true
        include_outgroups: true
    angsd_global_unrelated_unlinked:
        enabled: true
    angsd_raxml:
        enabled: true
        include_outgroups: true
        downsampling:
            max_per_population:
                default: 6
            exclude_samples: []
            use_all_samples: false
            seed: 20240526
    angsd_sfs:
        enabled: true
    sfs:
        enabled: true
        site_filters: [linked]
        fold_states: [fold]
        include_monomorphic: true
        realSFS:
            maxiter: 50000
            tole: 1e-6
    slice_outgroups:
        enabled: true
    ngsrelate:
        enabled: true
        kinship_threshold: 0.0884
    ngsld:
        enabled: true
        minmaf: 0.05
        max_kb_dist: 50
        min_weight: 0.5
        weight_field: "column_7"
    pcangsd:
        enabled: true
        iter: 1000
        minmaf: 0.05
        axes_plot: []
    ngsadmix:
        enabled: true
        maxK: 6
        n_replicates: 10
        maxiter: 5000
        minmaf: 0.05
    ngsdist:
        enabled: true
        models: [p, jc69]
        include_outgroups: true
    raxml:
        enabled: true
        na_fill: 0.01
        var_option: "both"
        model: "GTGTR4+FO+G"
        bs: 100
        outgroup_species: []
    treemix:
        enabled: true
        include_outgroups: true
        mode: pop
        glactools_bin: workflow/bin/glactools
        root_label: null
        max_m: 6
        reps: 10
        timeout_seconds: 300
        max_attempts: 3
        use_optm: true
        se: true
        merge_outgroups: false
        exclude_samples: []
        exclude_outgroups: []
        outgroup_species: []
    abbababa2:
        enabled: false
        angsd_args: >
            -doAbbababa2 1
            -doCounts 1
            -uniqueOnly 1
            -minMapQ 30
            -minQ 20
            -baq 2
            -useLast 1
        outgroup_samples: []
        outgroup_label: null
        exclude_samples: []
    snapp:
        enabled: true
        max_per_population: 4
        min_samples_locus: 4
        missingness_threshold: 0.2
        include_outgroups: true
        outgroup_samples: []
        exclude_samples: []
        population_aliases: {}
        outgroup_aliases: {}
        log_prefix: snapp
        snapp_prep:
            mcmc_length: 500000
            topology_weight: 1.0
            extra_args: ""
        constraints:
            type: crown
            taxa: null
            runs:
                run1:
                    distributions:
                        - null
