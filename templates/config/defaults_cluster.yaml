project:
    environment: "cluster"
    threads: 30
    output_prefix: "defaults"
    populations: []
    group_col: null
    population_labels: null

slurm:
    partition: "default"
    account: null
    qos: null
    reservation: null
    mail_type: null
    mail_user: null

paths:
    bam_dir: "results/bwa"
    singularity_dir: "${HOME}/envs/singularity"
    transfer:
        cluster_storage_root: "/lfs/aokid"

inputs:
    samples_tsv: "data/samples.tsv"
    outgroups_tsv: "data/outgroup.tsv"
    references_tsv: "data/references.tsv"

metadata:
    outgroups_seq_column: "sequencer"
    longread_keywords: ["PacBio", "ONT", "Nanopore"]

storage:
    reference:
        dir: "data/reference"
    outgroup:
        raw_dir: "data/raw/outgroup"
        merged_dir: "data/merged/outgroup"
    derived:
        ingroup:
            trim_dir: "results/trimmomatic/ingroup"
            qc_dir: "results/qc/ingroup"
            mapping_tmp_dir: null
        outgroup:
            trim_dir: "results/trimmomatic/outgroup"
            qc_dir: "results/qc/outgroup"
            mapping_tmp_dir: null
            longread_filter_dir: "results/longread/filter"
    bam:
        ingroup_dir: null
        outgroup_dir: null

reference:
    fasta: null
    fai: null
    storage_dir: "data/reference"
    download_method: "datasets"

reads:
    ingroup_dir: "data/raw/ingroup"
    ingroup_metadata:
        dir_col: "fastq_dir"
        prefix_col: "fastq_prefix"
        r1_suffix_col: "fastq_r1_suffix"
        r2_suffix_col: "fastq_r2_suffix"
        extension_col: "fastq_extension"
        default_prefix: ""
        default_r1_suffix: "_1"
        default_r2_suffix: "_2"
        default_extension: ".fastq.gz"

mapping:
    ingroup:
        mapper: bwa-mem2
        threads: 30
        map_unpaired: true
        extra: ""
    outgroup:
        mapper: bwa-mem2
        threads: 30
        map_unpaired: true
        extra: ""

longread:
    filter:
        enabled: true
        min_length: 1000
        keep_percent: 90
        extra: ""
    mapping:
        extra: ""

qc:
    ingroup:
        fastqc:
            contaminants: null
        trimmomatic:
            threads: 8
            adapters_fa: null
            clip: "2:30:7"
            slidingwindow: "4:15"
            leading: 30
            trailing: 30
            minlen: 36
            extra: ""
    outgroup:
        fastqc:
            contaminants: null
        trimmomatic:
            threads: 30
            adapters_fa: null
            clip: "2:30:7"
            slidingwindow: "4:15"
            leading: 30
            trailing: 30
            minlen: 36
            extra: ""

angsd:
    common_args: >
        -GL 1
        -doMaf 1
        -domajorminor 1
        -doBcf 1
        -doPost 1
        -doCounts 1
        -uniqueOnly 1
        -minMapQ 30
        -minQ 20
        -setmindepthind 2
        -skipTriallelic 1
        -baq 2
    args:
        intersect: >
            -doGLF 4
            -doGeno 4
        global: >
            -doGeno 4
            -doGLF 2
            -minMaf 0.15
            -SNP_pval 1e-6
        global_unrelated_unlinked: >
            -doGeno 4
            -doGLF 2
            -minMaf 0.15
            -SNP_pval 1e-06
        raxml: >
            -doGeno 4
            -doGLF 4
        treemix: >
            -doGeno 4
            -doGLF 4
        snapp: >
            -doGeno 4
            -doGLF 2
            -minMaf 0.2
            -SNP_pval 1e-6
            -postCutoff 0.9
        sfs: >
            -doGLF 4
            -doGeno 4
            -dosaf 1
    min_ind_ratio:
        intersect: 0.5
        sfs: 0.5
        global: 0.5
        raxml: 0.5
        treemix: 0.5
        snapp: 1.0

analyses:
    angsd_intersect:
        threads: 8
    angsd_global:
        threads: 8
        include_outgroups: true
    angsd_global_unrelated_unlinked:
        threads: 8
    angsd_raxml:
        threads: 8
        include_outgroups: true
        downsampling:
            max_per_population:
                default: 6
            exclude_samples: []
            use_all_samples: false
            seed: 20240526
    angsd_sfs:
        threads: 8
    sfs:
        site_filters: [linked]
        fold_states: [fold]
        include_monomorphic: true
        realSFS:
            threads: 10
            maxiter: 50000
            tole: 1e-6
    slice_outgroups:
        threads: 30
    ngsrelate:
        kinship_threshold: 0.0884
        threads: 4
    ngsld:
        threads: 8
        minmaf: 0.05
        max_kb_dist: 50
        min_weight: 0.5
        weight_field: "column_7"
    pcangsd:
        iter: 1000
        minmaf: 0.05
        threads: 8
        axes_plot: []
    ngsadmix:
        maxK: 6
        n_replicates: 10
        threads: 18
        maxiter: 5000
        minmaf: 0.05
    ngsdist:
        models: [p, jc69]
        threads: 8
    raxml:
        na_fill: 0.01
        threads_catg: 60
        var_option: "both"
        model: "GTGTR4+FO+G"
        bs: 100
        threads_run: 70
        outgroup_species: []
    treemix:
        threads: 8
        include_outgroups: true
        mode: pop
        glactools_bin: workflow/bin/glactools
        root_label: null
        max_m: 6
        reps: 10
        timeout_seconds: 300
        max_attempts: 3
        use_optm: true
        merge_outgroups: false
        exclude_samples: []
        exclude_outgroups: []
        outgroup_species: []
    abbababa2:
        enabled: false
        threads: 12
        angsd_args: >
            -doAbbababa2 1
            -doCounts 1
            -uniqueOnly 1
            -minMapQ 30
            -minQ 20
            -baq 2
            -useLast 1
        outgroup_samples: []
        outgroup_label: null
        exclude_samples: []
    snapp:
        enabled: true
        threads: 8
        max_per_population: 4
        min_samples_locus: 4
        missingness_threshold: 0.2
        include_outgroups: true
        outgroup_samples: []
        exclude_samples: []
        population_aliases: {}
        outgroup_aliases: {}
        log_prefix: snapp
        snapp_prep:
            mcmc_length: 500000
            topology_weight: 1.0
            extra_args: ""
        constraints:
            type: crown
            taxa: null
            runs:
                run1:
                    distributions:
                        - null
