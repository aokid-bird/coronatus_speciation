# Basic settings
environment: "local"
threads: 20

# scneario_config
output_prefix: "defaults"

# Directories
reference:
    fasta: null
    fai: null # you may specifiy this or otherwise it will be generated by common.smk
bam_dir: "results/bwa"
singularity_dir: "${HOME}/envs/singularity"

# Reusable storage for downloaded and preprocessing-heavy assets.
# Defaults keep everything inside the project directory, but these can be absolute
# paths such as /Data/WGS/... to reuse the same files across analyses.
storage:
    reference:
        dir: "data/reference"
    outgroup:
        raw_dir: "data/raw/outgroup"
        merged_dir: "data/merged/outgroup"
    derived:
        ingroup:
            trim_dir: "results/trimmomatic/ingroup"
            qc_dir: "results/qc/ingroup"
            mapping_tmp_dir: null # default: results/mapping/<output_prefix>/ingroup
        outgroup:
            trim_dir: "results/trimmomatic/outgroup"
            qc_dir: "results/qc/outgroup"
            mapping_tmp_dir: null # default: results/mapping/<output_prefix>/outgroup
            longread_filter_dir: "results/longread/filter"
    bam:
        ingroup_dir: null  # default: bam_dir/output_prefix
        outgroup_dir: null # default: <ingroup_dir>/outgroups

# Reference acquisition (local only; used when reference.fasta is null)
references_tsv: "data/references.tsv" # columns: accession, name, [url]
reference_dir: "data/reference" # legacy fallback; prefer storage.reference.dir
reference_download_method: "datasets" # datasets or wget

# Mapping backend (choose bwa or bwa-mem2)
mapping:
    ingroup:
        mapper: bwa-mem2 # options: bwa, bwa-mem2
        map_unpaired: true
        extra: "" # extra args for mapper (e.g., -M)
    outgroup:
        mapper: bwa-mem2 # options: bwa, bwa-mem2
        map_unpaired: true
        extra: "" # extra args for mapper (e.g., -M)

# Input FASTQs for ingroups
reads:
    ingroup_dir: "data/raw/ingroup" # legacy fallback when samples.tsv has no per-sample fastq_dir
    ingroup_metadata:
        dir_col: "fastq_dir"
        prefix_col: "fastq_prefix"
        r1_suffix_col: "fastq_r1_suffix"
        r2_suffix_col: "fastq_r2_suffix"
        extension_col: "fastq_extension"
        default_prefix: ""
        default_r1_suffix: "_1"
        default_r2_suffix: "_2"
        default_extension: ".fastq.gz"

# sample df
samples: "data/samples.tsv"

# Group definitions for each scenario
populations: [] # e.g., [hokkaido, fujisan]
group_col: null # e.g. "pop1"

# Readable labels for populations in plots/reports
population_labels: null
# examples
    # hokkaido: "hokkaido"
    # fujisan: "fujisan"

# Outgroup df
outgroups: "data/outgroups.tsv"
outgroups_seq_column: "sequencer"
longread_keywords: ["PacBio", "ONT", "Nanopore"]

# Long-read pipeline options
longread:
    filter:
        enabled: true
        min_length: 1000
        keep_percent: 90
        extra: ""
    mapping:
        # extra args passed to minimap2
        extra: ""

# QC and trimming
qc:
    ingroup:
        fastqc:
            contaminants: null # e.g., data/adapters/adapter-primer.fa
        trimmomatic:
            adapters_fa: null # e.g., data/adapters/TruSeq3-PE.fa
            clip: "2:30:7"
            slidingwindow: "4:15"
            leading: 30
            trailing: 30
            minlen: 36
            extra: "" # extra args for trimmomatic
    outgroup:
        fastqc:
            contaminants: null # e.g., data/adapters/contaminants.txt
        trimmomatic:
            adapters_fa: null # e.g., data/adapters/TruSeq3-PE.fa
            clip: "2:30:7"
            slidingwindow: "4:15"
            leading: 30
            trailing: 30
            minlen: 36
            extra: "" # extra args for trimmomatic

# ANGSD default arguments
# Check the following options
# OUTPUT PARAMETERS
# -doGLF
# -doBCF
# FILTERING PARAMETERS
# -setmindepthind
angsd_common_args: >
    -GL 1
    -doMaf 1
    -domajorminor 1
    -doBcf 1
    -doPost 1
    -doCounts 1
    -uniqueOnly 1
    -minMapQ 30
    -minQ 20
    -setmindepthind 2
    -skipTriallelic 1
    -baq 2

# ANGSD global (filtered) analysis arguments
angsd_args:
    intersect: >
        -doGLF 4
        -doGeno 4
    global: >
        -doGeno 4
        -doGLF 2
        -minMaf 0.15
        -SNP_pval 1e-6
    global_unrelated_unlinked: >
        -doGeno 4
        -doGLF 2
        -minMaf 0.15
        -SNP_pval 1e-06
    raxml: >
        -doGeno 4
        -doGLF 4
    treemix: >
        -doGeno 4
        -doGLF 4
    snapp: >
        -doGeno 4
        -doGLF 2
        -minMaf 0.2
        -SNP_pval 1e-6
        -postCutoff 0.9
    sfs: >
        -doGLF 4
        -doGeno 4
        -dosaf 1

# Site frequency spectrum analysis
sfs_analysis:
    site_filters: [linked]   # options: linked, unlinked
    fold_states: [fold]      # options: fold, unfold
    include_monomorphic: true
    realSFS:
        maxiter: 50000
        tole: 1e-6

# ANGSD minInd option
minIndRatio:
    intersect: 0.5
    sfs: 0.5
    global: 0.5
    raxml: 0.5
    treemix: 0.5
    snapp: 1.0

# ngsRelate
ngsrelate:
    kinship_threshold: 0.0884

# ngsLD
ngsld:
    minmaf: 0.05
    max_kb_dist: 50
    min_weight: 0.5
    weight_field: "column_7"

# PCAngsd & NGSAdmix
pcangsd:
    iter: 1000
    minmaf: 0.05
    axes_plot: [] # e.g., [pc1, pc2, pc3]

ngsadmix:
    maxK: 6
    n_replicates: 10
    threads: 18
    maxiter: 5000
    minmaf: 0.05

# raxml-ng
raxml:
    na_fill: 0.01
    threads_catg: 60
    var_option: "both"
    model: "GTGTR4+FO+G" # +FO = Estimated base freq, +G = Gamma site
    bs: 100
    threads_run: 70
    # Optional: choose specific outgroup species (full names matching outgroups.tsv 'taxon').
    # If empty or omitted, all outgroup samples are eligible as outgroups.
    # Example: ["Gallinago gallinago", "Gallinago media"]
    outgroup_species: [] 

# TreeMix settings
treemix:
    include_outgroups: true # include outgroup BAMs into treemix analysis
    mode: pop # pop or indiv
    glactools_bin: workflow/bin/glactools # path to glactools binary copied to cluster
    root_label: null # label for outgroup root population
    max_m: 6 # test migration edges 0..max_m
    reps: 10 # replicates per edge count
    timeout_seconds: 300 # kill a single TreeMix replicate attempt if it runs longer than this
    max_attempts: 3 # retry a timed-out or failed replicate up to this many times
    use_optm: true # run OptM if available in env
    merge_outgroups: false # if true, merge multiple outgroup taxa into a single root
    exclude_samples: []
    exclude_outgroups: []
    # Optional: choose specific outgroup species (full names matching outgroups.tsv 'taxon').
    # For TreeMix, these are converted to taxon abbreviations used as -root labels.
    # If empty or omitted, all outgroup taxa are used for the root set.
    # Example: ["Gallinago gallinago"]
    outgroup_species: []

# ABBABABA2 (D-statistics)
abbababa2:
    enabled: true
    threads: 12
    angsd_args: >
        -doAbbababa2 1
        -doCounts 1
        -uniqueOnly 1
        -minMapQ 30
        -minQ 20
        -baq 2
        -useLast 1
    outgroup_samples: [] #e.g. ["SAMN15573534"]
    outgroup_label: null
    exclude_samples: []

# Per-analysis outgroup inclusion
angsd_global:
    include_outgroups: true
angsd_raxml:
    include_outgroups: true
    downsampling:
        max_per_population:
            default: 6
        exclude_samples: []
        use_all_samples: false
        seed: 20240526

# ngsDist settings
ngsdist:
    models: ["p", "jc69"]  # available: p, jc69

# SNAPP analysis
snapp:
    enabled: true
    max_per_population: 4
    min_samples_locus: 4
    missingness_threshold: 0.2
    include_outgroups: true
    outgroup_samples: [] # e.g. ["SAMN15573534"]
    exclude_samples: []
    population_aliases: {}
    outgroup_aliases: {}
    log_prefix: snapp
    snapp_prep:
        mcmc_length: 500000
        topology_weight: 1.0
        extra_args: ""
    constraints:
        type: crown
        taxa: null # e.g., Phylloscopuswhistleri,hokkaido,fujisan
        runs:
            run1:
                distributions:
                    - null # e.g. lognormal(0,8.5,0.4)
