project:
  environment: "local"
  threads: 4
  output_prefix: "validation"
  populations: []
  group_col: "pop1"
  population_labels: null

paths:
  bam_dir: "results/bwa"
  singularity_dir: "${HOME}/envs/singularity"
  transfer:
    cluster_storage_root: "/lfs/aokid"
    cluster_project_dir: null

inputs:
  samples_tsv: "data/samples.tsv"
  outgroups_tsv: "data/outgroup.tsv"
  references_tsv: "data/references.tsv"

metadata:
  outgroups_seq_column: "sequencer"
  longread_keywords: ["PacBio", "ONT", "Nanopore"]

storage:
  reference:
    dir: "data/reference"
  outgroup:
    raw_dir: "data/raw/outgroup"
    merged_dir: "data/merged/outgroup"
  derived:
    ingroup:
      trim_dir: "results/trimmomatic/ingroup"
      qc_dir: "results/qc/ingroup"
      mapping_tmp_dir: null
    outgroup:
      trim_dir: "results/trimmomatic/outgroup"
      qc_dir: "results/qc/outgroup"
      mapping_tmp_dir: null
      longread_filter_dir: "results/longread/filter"
  bam:
    ingroup_dir: null
    outgroup_dir: null

reference:
  fasta: "data/reference/mock_reference.fa.gz"
  fai: null
  storage_dir: "data/reference"
  download_method: "datasets"

reads:
  ingroup_dir: "data/raw/ingroup"
  ingroup_metadata:
    basename_col: "sample"
    dir_col: "fastq_dir"
    prefix_col: "fastq_prefix"
    r1_suffix_col: "fastq_r1_suffix"
    r2_suffix_col: "fastq_r2_suffix"
    extension_col: "fastq_extension"
    default_prefix: ""
    default_r1_suffix: "_1"
    default_r2_suffix: "_2"
    default_extension: ".fastq.gz"

mapping:
  ingroup:
    mapper: "bwa-mem2"
    map_unpaired: true
    extra: ""
  outgroup:
    mapper: "bwa-mem2"
    map_unpaired: true
    extra: ""

longread:
  filter:
    enabled: true
    min_length: 1000
    keep_percent: 90
    extra: ""
  mapping:
    extra: ""

qc:
  ingroup:
    fastqc:
      adapters: null
      contaminants: null
    trimmomatic:
      adapters_fa: null
      clip: "2:30:7"
      slidingwindow: "4:15"
      leading: 30
      trailing: 30
      minlen: 36
      extra: ""
  outgroup:
    fastqc:
      adapters: null
      contaminants: null
    trimmomatic:
      adapters_fa: null
      clip: "2:30:7"
      slidingwindow: "4:15"
      leading: 30
      trailing: 30
      minlen: 36
      extra: ""

angsd:
  common_args: "-GL 1"
  args:
    intersect: "-doGLF 4 -doGeno 4"
    global: "-doGeno 4 -doGLF 2"
    global_unrelated_unlinked: "-doGeno 4 -doGLF 2"
    raxml: "-doGeno 4 -doGLF 4"
    treemix: "-doGeno 4 -doGLF 4"
    snapp: "-doGeno 4 -doGLF 2"
    sfs: "-doGLF 4 -doGeno 4 -dosaf 1"
  min_ind_ratio:
    intersect: 0.5
    sfs: 0.5
    global: 0.5
    raxml: 0.5
    treemix: 0.5
    snapp: 1.0

analyses:
  angsd_intersect:
    enabled: true
  angsd_global:
    enabled: true
  sfs:
    enabled: true
    site_filters: ["linked"]
    fold_states: ["fold"]
    include_monomorphic: true
    realSFS:
      maxiter: 100
      tole: "1e-6"
  ngsrelate:
    enabled: true
    kinship_threshold: 0.0884
  ngsld:
    enabled: true
    minmaf: 0.05
    max_kb_dist: 50
    min_weight: 0.5
    weight_field: "column_7"
  pcangsd:
    enabled: true
    iter: 10
    minmaf: 0.05
    axes_plot: []
  ngsadmix:
    enabled: true
    maxK: 2
    n_replicates: 1
    threads: 2
    maxiter: 10
    minmaf: 0.05
  raxml:
    enabled: true
    na_fill: 0.01
    threads_catg: 2
    var_option: "both"
    model: "GTGTR4+FO+G"
    bs: 10
    threads_run: 2
    outgroup_species: []
  treemix:
    enabled: true
    include_outgroups: true
    mode: "pop"
    glactools_bin: "workflow/bin/glactools"
    root_label: null
    max_m: 1
    reps: 1
    timeout_seconds: 60
    max_attempts: 1
    use_optm: false
    merge_outgroups: false
    exclude_samples: []
    exclude_outgroups: []
    outgroup_species: []
  abbababa2:
    enabled: false
    threads: 2
    angsd_args: "-doAbbababa2 1"
  snapp:
    enabled: false
  slice_outgroups:
    enabled: true
